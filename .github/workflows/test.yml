name: JavaScript tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: npm run db:import
      - run: npm run db:import
      - run: npm run sheet:db > /dev/null
      - run: npm run generator:build
      - run: git diff --exit-code -- measurement-sheet-generator.html
      - run: npm run intake:build
      - run: git diff --exit-code -- client-intake.html
      - run: npm run techpack:build
      - run: git diff --exit-code -- tech-pack.html
      - run: npm run pwa:build
