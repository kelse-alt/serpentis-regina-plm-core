<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f0ded9" />
    <meta name="description" content="Enter the worlds of Amaya Kelsea, Serpentis Regina and KLS. Design, bespoke and procurement." />
    <title>The Threshold — Serpentis Regina</title>
  </head>
  <body>
    <a class="skip-link" href="#worlds">Skip to the worlds</a>
    <div class="page-shell">
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="Serpentis Regina — the threshold">SERPENTIS REGINA<span>THE THRESHOLD</span></a>
        <div class="edition">LOS ANGELES <span aria-hidden="true"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M4 16 16 4M4 4h12v12" stroke="currentColor" stroke-width="1"/></svg></span> THREE WORLDS</div>
      </header>
      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">DESIGN. DEVOTION. DIRECTION.</p>
          <h1 id="page-title">One vision. <em>Three worlds.</em></h1>
          <p class="invitation">Choose the world that calls to you.</p>
        </section>
        <section id="worlds" class="worlds" aria-label="Choose your world"></section>
        <div class="gallery-notes">
          <p><span class="rotation-icon" aria-hidden="true">↔</span> DRAG TO TURN · SELECT TO ENTER</p>
          <div class="finish-picker" role="group" aria-label="Sculpture finish">
            <span>THE FINISH</span>
            <button type="button" data-finish="reflective" aria-pressed="true">Iridescent</button>
            <button type="button" data-finish="pearl" aria-pressed="false">Pearl</button>
          </div>
        </div>
      </main>
      <footer><span>AMAYA KELSEA · SERPENTIS REGINA · KLS</span><span>© <span id="year"></span> SERPENTIS REGINA</span></footer>
    </div>
    <dialog id="world-dialog" aria-labelledby="dialog-title">
      <button type="button" class="dialog-close" aria-label="Return to the threshold">✕</button>
      <p id="dialog-role" class="eyebrow"></p>
      <h2 id="dialog-title"></h2>
      <p id="dialog-description"></p>
      <ul id="dialog-topics"></ul>
      <a id="dialog-destination" class="destination-link" hidden>Enter the atelier <span aria-hidden="true"><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 16 16 4M4 4h12v12" stroke="currentColor" stroke-width="1.2"/></svg></span></a>
      <p id="dialog-note" class="dialog-note"></p>
      <button type="button" class="return-link">Return to the threshold <span aria-hidden="true">←</span></button>
    </dialog>
    <noscript><p class="noscript">Enter <a href="https://www.serpentisregina.com/">Serpentis Regina’s bespoke atelier</a>. The interactive sculptures require JavaScript.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
