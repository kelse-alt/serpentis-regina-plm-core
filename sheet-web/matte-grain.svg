<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
  <filter id="ash" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope=".12" intercept=".52"/>
      <feFuncG type="linear" slope=".12" intercept=".54"/>
      <feFuncB type="linear" slope=".12" intercept=".56"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#ash)"/>
</svg>
